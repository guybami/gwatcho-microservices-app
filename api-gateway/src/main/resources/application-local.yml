server:
  port: 8085
  reactive:
    context-path: /api-gateway

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/gwatcho-shop
          jwk-set-uri: http://localhost:8080/realms/gwatcho-shop/protocol/openid-connect/certs


  cloud:
    gateway:
      routes:

        # USER SERVICE
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api-gateway/user-service/**
          filters:
            - StripPrefix=1

        # PRODUCT SERVICE
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api-gateway/product-service/**
          filters:
            - StripPrefix=1

        # ORDER SERVICE
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api-gateway/order-service/**
          filters:
            - StripPrefix=1

        # DELIVERY SERVICE
        - id: delivery-service
          uri: http://localhost:8084
          predicates:
            - Path=/api-gateway/delivery-service/**
          filters:
            - StripPrefix=1

        # PAYMENT SERVICE
        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api-gateway/payment-service/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info