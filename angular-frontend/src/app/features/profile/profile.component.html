<div class="profile-container">

  <h1>My Profile</h1>

  <form (ngSubmit)="saveProfile()">

    <section>
      <h2>Personal Information</h2>

      <div class="form-row">

        <div class="form-group">
          <label for="firstName">First name</label>
          <input
            id="firstName"
            name="firstName"
            [(ngModel)]="firstName"
            required>
        </div>

        <div class="form-group">
          <label for="lastName">Last name</label>
          <input
            id="lastName"
            name="lastName"
            [(ngModel)]="lastName"
            required>
        </div>

      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required>
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input
          id="phone"
          type="tel"
          name="phone"
          [(ngModel)]="phone">
      </div>

    </section>

    <section>

      <h2>Delivery Address</h2>

      <div class="form-row">

        <div class="form-group">
          <label for="street">Street</label>
          <input
            id="street"
            name="street"
            [(ngModel)]="street"
            required>
        </div>

        <div class="form-group">
          <label for="houseNumber">House number</label>
          <input
            id="houseNumber"
            name="houseNumber"
            [(ngModel)]="houseNumber"
            required>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="postalCode">Postal code</label>
          <input
            id="postalCode"
            name="postalCode"
            [(ngModel)]="postalCode"
            required>
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input
            id="city"
            name="city"
            [(ngModel)]="city"
            required>
        </div>

      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <input
          id="country"
          name="country"
          [(ngModel)]="country"
          required>
      </div>

    </section>

    <button type="submit">
      Save Profile
    </button>

  </form>

</div>
