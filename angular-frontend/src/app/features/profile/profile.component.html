<div class="profile-page">

  <!-- Page Header -->
  <div class="profile-header">
    <div>
      <span class="page-eyebrow">ACCOUNT</span>
      <h1>My Profile</h1>
      <p>
        Manage your personal information and delivery address.
      </p>
    </div>
  </div>

  <form #profileForm="ngForm" (ngSubmit)="saveProfile()" class="profile-form">

    <!-- Personal Information -->
    <section class="profile-card">

      <div class="card-header">
        <div class="card-icon personal-icon">
          👤
        </div>

        <div>
          <h2>Personal Information</h2>
          <p>Your contact information</p>
        </div>
      </div>

      <div class="form-grid">

        <!-- First Name -->
        <div class="form-group">
          <label for="firstName">
            First name
            <span class="required">*</span>
          </label>

          <input id="firstName" name="firstName" type="text"
                 [(ngModel)]="firstName" placeholder="Enter your first name"
                 autocomplete="given-name" required />
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label for="lastName">
            Last name
            <span class="required">*</span>
          </label>

          <input id="lastName" name="lastName" type="text"
                 [(ngModel)]="lastName" placeholder="Enter your last name"
                 autocomplete="family-name" required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            Email address
            <span class="required">*</span>
          </label>

          <input id="email" name="email" type="email" [(ngModel)]="email"
                 placeholder="you@example.com" autocomplete="email" required />

          <span class="field-hint">
            We'll use this address for order notifications.
          </span>
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">
            Phone number
          </label>

          <input id="phone" name="phone" type="tel" [(ngModel)]="phone"
                 placeholder="+49 170 1234567" autocomplete="tel" />
        </div>

      </div>

    </section>


    <!-- Delivery Address -->
    <section class="profile-card">

      <div class="card-header">
        <div class="card-icon address-icon">
          📍
        </div>

        <div>
          <h2>Delivery Address</h2>
          <p>Where should we deliver your orders?</p>
        </div>
      </div>

      <div class="form-grid">

        <!-- Street -->
        <div class="form-group form-group-wide">
          <label for="street">
            Street
            <span class="required">*</span>
          </label>

          <input id="street" name="street" type="text" [(ngModel)]="street"
                 placeholder="e.g. Hauptstraße" autocomplete="street-address"
                 required />
        </div>

        <!-- House Number -->
        <div class="form-group">
          <label for="houseNumber">
            House number
            <span class="required">*</span>
          </label>

          <input id="houseNumber" name="houseNumber" type="text"
                 [(ngModel)]="houseNumber" placeholder="e.g. 25" required />
        </div>

        <!-- Postal Code -->
        <div class="form-group">
          <label for="postalCode">
            Postal code
            <span class="required">*</span>
          </label>

          <input id="postalCode" name="postalCode" type="text"
                 [(ngModel)]="postalCode" placeholder="e.g. 74072"
                 autocomplete="postal-code" required />
        </div>

        <!-- City -->
        <div class="form-group">
          <label for="city">
            City
            <span class="required">*</span>
          </label>

          <input id="city" name="city" type="text" [(ngModel)]="city"
                 placeholder="e.g. Heilbronn" autocomplete="address-level2"
                 required />
        </div>

        <!-- Country -->
        <div class="form-group">
          <label for="country">
            Country
            <span class="required">*</span>
          </label>

          <select id="country" name="country" [(ngModel)]="country" required>
            <option value="Germany">Germany</option>
            <option value="Austria">Austria</option>
            <option value="Switzerland">Switzerland</option>
            <option value="France">France</option>
            <option value="Belgium">Belgium</option>
            <option value="Netherlands">Netherlands</option>
            <option value="Luxembourg">Luxembourg</option>
          </select>
        </div>

      </div>

    </section>


    <!-- Actions -->
    <div class="form-actions">

      <button type="button" class="btn btn-secondary">
        Cancel
      </button>

      <button type="submit" class="btn btn-primary"
              [disabled]="profileForm.invalid">
        <span class="button-icon">✓</span>
        Save Profile
      </button>

    </div>

  </form>

</div>
