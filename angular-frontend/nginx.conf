server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # API Gateway - Product Service
    # ==========================================
    location /api/ {
        proxy_pass http://api-gateway:8085/api-gateway/product-service/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Keycloak JWT
        proxy_set_header Authorization $http_authorization;
    }

	  # ==========================================
    # User Service
    # ==========================================
    location /api/users/ {
        proxy_pass http://api-gateway:8085/api-gateway/user-service/api/users/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
    }

    # ==========================================
    # Order Service
    # ==========================================
    location /api/order-service/ {
        proxy_pass http://api-gateway:8085/api-gateway/order-service/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # ==========================================
    # Angular application
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
